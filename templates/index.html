<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESH BINGO - FULL & PIXEL PERFECT</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --gold: #ffcc00; --bg: #1e293b; --red: #ff3e3e; --green: #00ff88; --orange: #ff8800; --purple: #a855f7; }
        body { background: var(--bg); color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh; }
        
        #auth-ui { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at center, #1e293b, #050a18); position: absolute; inset: 0; z-index: 9999; }
        .auth-card { background: rgba(255, 255, 255, 0.03); border: 2px solid var(--gold); border-radius: 20px; padding: 30px 20px; width: 100%; max-width: 360px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .auth-input { padding: 14px; width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; font-size: 1rem; background: #fff; color: #000; font-weight: bold; margin: 10px 0; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--green), #00cc6a); color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; }

        #main-app-content { display: none; flex-direction: column; height: 100vh; width: 100vw; overflow: hidden; background: #1e293b; position: absolute; inset: 0; }
        #lobby-ui { flex: 1; overflow-y: auto; display: flex; flex-direction: column; background: #050a18; padding: 10px; }
        .grid-500 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; flex: 1; overflow-y: auto; background: #000; padding: 10px; border-radius: 10px; }
        .t-box { background: #fff; color: #000; font-size: 0.75rem; padding: 8px 0; font-weight: bold; border-radius: 4px; cursor: pointer; border: 1px solid transparent; }
        .t-box.mine { background: var(--gold) !important; color: #000 !important; }
        .t-box.sold { background: #333; color: #666; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="auth-ui">
        <div class="auth-card">
            <h2 style="color:var(--gold);">ተመዝገብ</h2>
            <p style="color:#94a3b8;">ወደ ጨዋታው ለመግባት መረጃዎን ያስገቡ</p>
            <input type="text" id="reg-username" class="auth-input" placeholder="ስምዎን ያስገቡ...">
            <input type="tel" id="reg-phone" class="auth-input" placeholder="09... ወይም 07...">
            <button class="btn-login" onclick="registerUser()">🚀 ወደ ጨዋታው ግባ</button>
        </div>
    </div>

    <div id="main-app-content">
        <div id="lobby-ui">
            <h3 style="color:var(--gold);">ካርቴላ ይምረጡ (10 ETB)</h3>
            <div class="grid-500" id="ticket-area"></div>
        </div>
    </div>

    <script>
        let phone = localStorage.getItem('phone');
        let username = localStorage.getItem('username');
        let socket = null;

        window.onload = function() {
            if (phone && phone.trim() !== "") {
                showGameUI();
            } else {
                showAuthUI();
            }
        }

        function showAuthUI() {
            document.getElementById('auth-ui').style.display = 'flex';
            document.getElementById('main-app-content').style.display = 'none';
        }

        function showGameUI() {
            document.getElementById('auth-ui').style.display = 'none';
            document.getElementById('main-app-content').style.display = 'flex'; 
            initTicketsOnce();
            initWebSocket();
        }

        function registerUser() {
            let inputName = document.getElementById('reg-username').value.trim();
            let inputPhone = document.getElementById('reg-phone').value.trim();
            if (inputName.length < 2) return alert("እባክዎ ትክክለኛ ስም ያስገቡ!");
            const cleanPhone = inputPhone.replace(/[^0-9+]/g, '');
            if (cleanPhone.length < 9) return alert("እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ!");

            localStorage.setItem('phone', cleanPhone);
            localStorage.setItem('username', inputName);
            phone = cleanPhone;
            username = inputName;
            showGameUI();
        }

        function initWebSocket() {
            if (typeof io !== "undefined") {
                socket = io();
                socket.on('connect', () => forceRecoveryRefresh());
                socket.on('game_update_10', (d) => applyGameStateData(d));
            }
        }

        function forceRecoveryRefresh() {
            if (!phone) return;
            fetch(`/get_status?phone=${encodeURIComponent(phone)}&room=10`)
            .then(r => r.json())
            .then(d => applyGameStateData(d)).catch(() => {});
        }

        function applyGameStateData(d) {
            if (!d) return;
            if (d.sold_tickets) renderTickets(d.sold_tickets);
        }

        function initTicketsOnce() {
            const area = document.getElementById('ticket-area');
            if(area && area.children.length === 0) { 
                for(let i=1; i<=500; i++) { 
                    let div = document.createElement('div'); 
                    div.className = 't-box'; 
                    div.innerText = i; 
                    div.id = 't-' + i; 
                    div.onclick = () => buy(i);
                    area.appendChild(div); 
                } 
            }
        }

        function renderTickets(sold) {
            for(let i=1; i<=500; i++) {
                let box = document.getElementById('t-'+i); 
                if(!box) continue;
                if(sold && sold[i]) { 
                    const isMine = sold[i] === phone;
                    box.className = isMine ? 't-box mine' : 't-box sold'; 
                } else { 
                    box.className = 't-box'; 
                }
            }
        }

        function buy(n) {
            fetch('/buy_specific_ticket', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ phone: phone, ticket_num: n, username: username, room: '10' })
            }).then(() => forceRecoveryRefresh());
        }
    </script>
</body>
</html>
