<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESH BINGO - SECURE PREMIUM</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { 
            --gold: #ffcc00; 
            --bg: #050a18; 
            --red: #ff3e3e; 
            --green: #00ff88; 
            --orange: #ff8800; 
            --purple: #a855f7;
        }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #auth-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #1e293b, #050a18);
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: var(--gold); margin-top: 0; font-size: 1.6rem; letter-spacing: 1px; }
        .auth-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .input-group { width: 100%; text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        .auth-input { padding: 14px; width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; font-size: 1rem; background: #fff; color: #000; font-weight: bold; }
        .auth-input:focus { border-color: var(--gold); outline: none; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--green), #00cc6a); color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); transition: 0.2s; }
        .btn-login:disabled { background: #555; cursor: not-allowed; opacity: 0.6; box-shadow: none; }
        .btn-login:active { transform: scale(0.98); }

        #main-app-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
        }

        .header-banner { 
            background: linear-gradient(145deg, #1e293b, #050a18); 
            padding: 8px 15px; 
            border-bottom: 2px solid var(--gold); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 100;
        }
        .header-banner h1 { margin: 0; font-size: 1.2rem; color: var(--gold); letter-spacing: 1px; }
        
        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* 🌟 2. Inline Notification Bar (#inline-notification) ከ Refresh ቁልፍ ቀደም ብሎ ባለው ክፍተት ውስጥ */
        #inline-notification {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--green);
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--green);
            padding: 4px 8px;
            border-radius: 6px;
            display: none;
            white-space: nowrap;
            animation: fadeInOut 0.4s ease;
            box-shadow: 0 2px 6px rgba(0,255,136,0.3);
        }
        @keyframes fadeInOut {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-top-refresh, .btn-top-admin {
            background: var(--gold);
            color: #000;
            border: 1px solid white;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .btn-top-admin {
            background: var(--red);
            color: white;
            display: none;
        }
        .btn-top-refresh:active, .btn-top-admin:active { transform: scale(0.9); }

        .stats { display: flex; justify-content: space-around; background: rgba(255,255,255,0.05); padding: 6px; margin: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .stats div { font-size: 0.75rem; color: #94a3b8; }
        .stats b { display: block; font-size: 0.95rem; color: var(--gold); }
        
        #lobby-ui { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .action-bar { display: flex; justify-content: center; gap: 5px; padding: 4px 8px; flex-wrap: wrap; }
        .btn-main { flex: 1; min-width: 70px; padding: 9px 4px; border: none; border-radius: 8px; font-weight: 900; cursor: pointer; font-size: 0.8rem; transition: 0.2s; }
        .btn-main:active { transform: scale(0.95); }
        .btn-deposit { background: var(--green); color: #000; }
        .btn-withdraw { background: var(--orange); color: #fff; }
        .btn-transfer { background: var(--purple); color: #fff; }

        .content-area { flex: 1; display: flex; flex-direction: column; padding: 5px 10px; overflow-y: auto; }
        .tickets-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding-bottom: 20px; }
        .ticket-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px; position: relative; }
        .ticket-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--gold); margin-bottom: 4px; font-weight: bold; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
        .bingo-cell { aspect-ratio: 1; background: rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: bold; border-radius: 3px; }
        .bingo-cell.marked { background: var(--green); color: #000; }

        /* ሞዳል መስኮቶች */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
        .modal-content { background: #1e293b; border: 2px solid var(--gold); padding: 20px; border-radius: 15px; width: 90%; max-width: 320px; box-sizing: border-box; text-align: left; }
        .modal-content h3 { margin-top: 0; color: var(--gold); font-size: 1.1rem; }
        .modal-input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; background: #fff; color: #000; font-weight: bold; }
        .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-confirm { background: var(--green); color: #000; }
        .btn-cancel { background: var(--red); color: #fff; }
    </style>
</head>
<body>

    <!-- 1. AUTH SCREEN -->
    <div id="auth-ui">
        <div class="auth-card">
            <h2>BESH BINGO</h2>
            <p>ለመጫወት እባክዎ ስልክ ቁጥርዎን ያስገቡ</p>
            <div class="input-group">
                <label>ስልክ ቁጥር (Phone Number)</label>
                <input type="tel" id="auth-phone-input" class="auth-input" placeholder="09xxxxxxxx" />
            </div>
            <button class="btn-login" id="btn-login-submit" onclick="handleLogin()">ግባ (LOGIN)</button>
        </div>
    </div>

    <!-- 2. MAIN APP CONTENT -->
    <div id="main-app-content" style="display: none;">
        <div class="header-banner">
            <h1>BESH BINGO</h1>
            <div class="header-btns">
                <!-- 🌟 2. Inline Notification Bar (#inline-notification) ከ Refresh ቁልፍ ቀደም ብሎ ተቀምጧል -->
                <div id="inline-notification"></div>
                
                <button class="btn-top-refresh" onclick="refreshStatus()">🔄 አድስ</button>
                <button class="btn-top-admin" id="btn-admin-dashboard" onclick="openAdminDashboard()">🛠 አድሚን</button>
            </div>
        </div>

        <div class="stats">
            <div>ቀሪ ባላንስ <b id="user-balance">0.00 ETB</b></div>
            <div>የድስት (Pot) <b id="game-pot">0 ETB</b></div>
            <div>ሁኔታ <b id="game-status-text">Lobby</b></div>
        </div>

        <div class="action-bar">
            <button class="btn-main btn-deposit" onclick="openModal('deposit-modal')">➕ ገንዘብ አስገባ</button>
            <button class="btn-main btn-withdraw" onclick="openModal('withdraw-modal')">📤 አውጣ</button>
            <button class="btn-main btn-transfer" onclick="openModal('transfer-modal')">🔄 አስተላልፍ</button>
        </div>

        <div class="content-area">
            <h3>የእርስዎ ካርዶች</h3>
            <div id="my-tickets-container" class="tickets-container">
                <!-- ተጠቃሚው የገዛቸው ካርዶች እዚህ ይጫወታሉ -->
            </div>
        </div>
    </div>

    <!-- ሞዳሎች -->
    <div id="deposit-modal" class="modal">
        <div class="modal-content">
            <h3>ዲፖዚት (ገንዘብ ማስገባት)</h3>
            <label>መጠን (ETB)</label>
            <input type="number" id="dep-amount" class="modal-input" placeholder="100">
            <label>የትራንዛክሽን መለያ (Tx ID)</label>
            <input type="text" id="dep-txid" class="modal-input" placeholder="ትራንዛክሽን አይዲ">
            <div class="modal-btns">
                <button class="modal-btn btn-confirm" onclick="submitDeposit()">ላክ</button>
                <button class="modal-btn btn-cancel" onclick="closeModal('deposit-modal')">ሰርዝ</button>
            </div>
        </div>
    </div>

    <div id="withdraw-modal" class="modal">
        <div class="modal-content">
            <h3>ገንዘብ ማውጣት (Withdrawal)</h3>
            <label>መጠን (ETB - ቢያንስ 51)</label>
            <input type="number" id="wit-amount" class="modal-input" placeholder="50ፍ">
            <div class="modal-btns">
                <button class="modal-btn btn-confirm" onclick="submitWithdrawal()">አውጣ</button>
                <button class="modal-btn btn-cancel" onclick="closeModal('withdraw-modal')">ሰርዝ</button>
            </div>
        </div>
    </div>

    <div id="transfer-modal" class="modal">
        <div class="modal-content">
            <h3>ገንዘብ ማስተላለፍ (Transfer)</h3>
            <label>የተቀባይ ስልክ ቁጥር</label>
            <input type="tel" id="trf-phone" class="modal-input" placeholder="09xxxxxxxx">
            <label>መጠን (ETB)</label>
            <input type="number" id="trf-amount" class="modal-input" placeholder="50">
            <div class="modal-btns">
                <button class="modal-btn btn-confirm" onclick="submitTransfer()">አስተላልፍ</button>
                <button class="modal-btn btn-cancel" onclick="closeModal('transfer-modal')">ሰርዝ</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUserPhone = localStorage.getItem('besh_phone') || '';
        let currentUsername = localStorage.getItem('besh_username') || '';

        window.onload = function() {
            if (currentUserPhone) {
                document.getElementById('auth-phone-input').value = currentUserPhone;
                handleLogin();
            }
        };

        function handleLogin() {
            const phoneInput = document.getElementById('auth-phone-input').value.trim();
            if (!phoneInput) {
                alert('እባክዎ ትክክለኛ ስልክ ቁጥር ያስገቡ!');
                return;
            }

            fetch('/register_or_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneInput, username: currentUsername })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    currentUserPhone = phoneInput;
                    localStorage.setItem('besh_phone', currentUserPhone);
                    localStorage.setItem('besh_username', data.username);
                    
                    document.getElementById('auth-ui').style.display = 'none';
                    document.getElementById('main-app-content').style.display = 'flex';
                    
                    // አድሚን ከሆነ የዳሽቦርድ ቁልፍ ማሳየት
                    if (currentUserPhone.endsWith("0945880474")) {
                        document.getElementById('btn-admin-dashboard').style.display = 'flex';
                    }

                    refreshStatus();
                } else {
                    alert(data.msg || 'መግባት አልተቻለም!');
                }
            })
            .catch(err => console.error(err));
        }

        function refreshStatus() {
            if (!currentUserPhone) return;
            fetch(`/get_status?phone=${currentUserPhone}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('user-balance').innerText = `${data.balance.toFixed(2)} ETB`;
                document.getElementById('game-pot').innerText = `${data.pot} ETB`;
                document.getElementById('game-status-text').innerText = data.status.toUpperCase();
                renderMyCards(data.my_cards, data.drawn_balls);
            });
        }

        function renderMyCards(cards, drawnBalls) {
            const container = document.getElementById('my-tickets-container');
            container.innerHTML = '';
            if (!cards || cards.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8; font-size:0.8rem; grid-column:1/-1;">ምንም ካርድ የለዎትም</p>';
                return;
            }

            cards.forEach((card, idx) => {
                let cardHtml = `<div class="ticket-card"><div class="ticket-header"><span>ካርድ #${idx+1}</span></div><div class="bingo-grid">`;
                card.forEach((num, cellIdx) => {
                    let isMarked = cellIdx === 12 || num === 0 || drawnBalls.includes(num) || drawnBalls.includes(`BINGO'[Math.floor((num-1)/15)]${num}`);
                    cardHtml += `<div class="bingo-cell ${isMarked ? 'marked' : ''}">${num === 0 ? '★' : num}</div>`;
                });
                cardHtml += `</div></div>`;
                container.innerHTML += cardHtml;
            });
        }

        // 🌟 1 & 3. Socket Listeners: deposit_success_notify & balance_update (Auto Refresh Balance)
        socket.on('balance_update', function(data) {
            if (data.phone === currentUserPhone) {
                document.getElementById('user-balance').innerText = `${Number(data.balance).toFixed(2)} ETB`;
            }
        });

        socket.on('deposit_success_notify', function(data) {
            if (data.phone === currentUserPhone) {
                showInlineNotification(`✅ ዲፖዚት ጸድቋል! +${data.amount} ETB`);
                refreshStatus(); // 3. የባላንስ መጠኑን በቅጽበት ማደስ
            }
        });

        // 🌟 2. Inline Notification Bar ማሳያ ፈንክሽን
        function showInlineNotification(message) {
            const notif = document.getElementById('inline-notification');
            notif.innerText = message;
            notif.style.display = 'inline-block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 4000);
        }

        socket.on('game_update', function(data) {
            document.getElementById('game-pot').innerText = `${data.pot} ETB`;
            document.getElementById('game-status-text').innerText = data.status.toUpperCase();
            refreshStatus();
        });

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function submitDeposit() {
            const amt = document.getElementById('dep-amount').value;
            const txId = document.getElementById('dep-txid').value;
            fetch('/request_deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentUserPhone, amount: amt, transaction_id: txId, method: 'TELE BIRR' })
            }).then(res => res.json()).then(data => {
                alert(data.msg || 'የዲፖዚት ጥያቄዎ ተልኳል!');
                closeModal('deposit-modal');
            });
        }

        function submitWithdrawal() {
            const amt = document.getElementById('wit-amount').value;
            fetch('/request_withdrawal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentUserPhone, amount: amt, method: 'TELE BIRR' })
            }).then(res => res.json()).then(data => {
                alert(data.msg);
                closeModal('withdraw-modal');
            });
        }

        function submitTransfer() {
            const recPh = document.getElementById('trf-phone').value;
            const amt = document.getElementById('trf-amount').value;
            fetch('/request_transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: currentUserPhone, receiver_phone: recPh, amount: amt })
            }).then(res => res.json()).then(data => {
                alert(data.msg);
                closeModal('transfer-modal');
                refreshStatus();
            });
        }

        function openAdminDashboard() {
            window.open(`/admin_get_users?phone=${currentUserPhone}`, '_blank');
        }
    </script>
</body>
</html>
