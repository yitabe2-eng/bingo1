<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESH BINGO - SECURE PREMIUM</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        :root { 
            --gold: #ffcc00; 
            --bg: #050a18; 
            --red: #ff3e3e; 
            --green: #00ff88; 
            --orange: #ff8800; 
            --purple: #a855f7;
        }
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
        }
        
        #auth-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            background: radial-gradient(circle at center, #1e293b, #050a18);
            position: absolute;
            inset: 0;
            z-index: 9999;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--gold);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: var(--gold); margin-top: 0; font-size: 1.6rem; letter-spacing: 1px; }
        .auth-card p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        .input-group { width: 100%; text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 0.85rem; color: var(--gold); margin-bottom: 5px; font-weight: bold; }
        .auth-input { padding: 14px; width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); box-sizing: border-box; font-size: 1rem; background: #fff; color: #000; font-weight: bold; }
        .auth-input:focus { border-color: var(--gold); outline: none; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--green), #00cc6a); color: #000; border: none; border-radius: 10px; font-weight: 900; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); transition: 0.2s; }
        .btn-login:disabled { background: #555; cursor: not-allowed; opacity: 0.6; box-shadow: none; }
        .btn-login:active { transform: scale(0.98); }

        #main-app-content {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
            background: #0b132b;
            position: absolute;
            inset: 0;
        }

        .header-banner { 
            background: linear-gradient(145deg, #1e293b, #050a18); 
            padding: 8px 15px; 
            border-bottom: 2px solid var(--gold); 
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 100;
        }
        .header-banner h1 { margin: 0; font-size: 1.2rem; color: var(--gold); letter-spacing: 1px; }
        
        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #inline-notification {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--green);
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--green);
            padding: 4px 8px;
            border-radius: 6px;
            display: none;
            white-space: nowrap;
            animation: fadeInOut 0.4s ease;
            box-shadow: 0 2px 6px rgba(0,255,136,0.3);
        }
        @keyframes fadeInOut {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .btn-top-refresh, .btn-top-admin {
            background: var(--gold);
            color: #000;
            border: 1px solid white;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 6px 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .btn-top-admin {
            background: var(--red);
            color: white;
            display: none;
        }
        .btn-top-refresh:active, .btn-top-admin:active { transform: scale(0.9); }
