<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BESH BINGO</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --gold: #f59e0b; 
            --gold-light: #ffcc00;
            --bg: #121c29; 
            --red: #ef4444; 
            --green: #10b981; 
            --orange: #f97316; 
            --purple: #a855f7;
            --slate-light: #e8edf2;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            background: var(--bg); 
            color: #ffffff; 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            text-align: center; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            width: 100vw; 
            height: 100vh; 
            user-select: none;
        }
        
        #auth-ui {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: radial-gradient(circle at center, #1e293b, #050a18);
            position: absolute;
            inset: 0;
            z-index: 9999;
        }
        .auth-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--gold-light);
            border-radius: 24px;
            padding: 28px 22px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        .auth-card h2 { color: var(--gold-light); margin-top: 0; font-size: 1.6rem; font-weight: 900; }
        .input-group { width: 100%; text-align: left; margin-bottom: 14px; }
        .input-group label { display: block; font-size: 0.8rem; color: var(--gold-light); margin-bottom: 6px; font-weight: 800; }
        .auth-input { padding: 13px 15px; width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); font-size: 1rem; background: #fff; color: #000; font-weight: bold; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669); color: #fff; border: none; border-radius: 12px; font-weight: 900; font-size: 1.05rem; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        #main-app-content {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #1e293b;
            position: absolute;
            inset: 0;
        }

        #inline-notification {
            font-size: 0.82rem;
            font-weight: 800;
            color: #000;
            background: #10b981;
            padding: 8px 18px;
            border-radius: 20px;
            display: none;
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        #lobby-ui { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            background: var(--slate-light); 
            height: 100vh;
            overflow: hidden;
        }

        .stats-badges-bar {
            background: #121c29;
            padding: 6px 10px 10px 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            flex-shrink: 0;
        }
        .badge-pill {
            border-radius: 14px;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .badge-label { font-size: 0.55rem; font-weight: 900; text-transform: uppercase; }
        .badge-val { font-size: 0.85rem; font-weight: 900; }
        .badge-room { background: #f59e0b; color: #000; }
        .badge-sold { background: #1e293b; color: #fff; }
        .badge-time { background: #1e293b; color: #f87171; }
        .badge-balance { background: #10b981; color: #fff; cursor: pointer; }

        .grid-container-photo {
            flex: 1;
            overflow-y: auto;
            padding: 8px 10px;
            background: #dbe3ec;
        }
        .grid-8-cols {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 6px;
            background: #e2e8f0;
            padding: 8px;
            border-radius: 16px;
        }
        .t-box {
            background: #ffffff;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 800;
            padding: 9px 0;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .t-box.mine {
            background: #f59e0b !important;
            color: #000000 !important;
            border: 2px solid #d97706 !important;
        }
        .t-box.sold {
            background: #cbd5e1 !important;
            color: #94a3b8 !important;
            pointer-events: none;
        }

        .bottom-slots-tray {
            background: #ffffff;
            border-top: 1px solid #cbd5e1;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-shrink: 0;
        }
        .slot-card {
            flex: 1;
            max-width: 136px;
            height: 105px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        .slot-card.empty { border: 2px dashed #94a3b8; background: #f8fafc; color: #94a3b8; }
        .slot-card.active-cartela { border: 2px solid #f59e0b; background: #ffffff; padding: 3px; justify-content: space-between; }
        .cartela-5x5-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; width: 100%; background: #f1f5f9; padding: 2px; }
        .cartela-5x5-cell { height: 16px; display: flex; align-items: center; justify-content: center; font-size: 0.58rem; font-weight: 900; background: #fff; color: #1e293b; }
        .cartela-5x5-cell.free { background: #f59e0b; color: #000; }

        /* GAME UI */
        #game-ui {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #cbd5e1;
            color: #1e293b;
            position: absolute;
            inset: 0;
        }
        .game-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f172a;
            height: 62px;
            padding: 0 14px;
            position: relative;
        }
        .global-stats-bar { display: flex; gap: 20px; align-items: center; }
        .stat-label { font-size: 0.55rem; font-weight: 900; color: #94a3b8; text-transform: uppercase; }
        .stat-val { font-size: 0.85rem; font-weight: 900; color: #00ff88; }
        
        #ball-circle {
            position: absolute;
            right: 12px;
            top: 15px;
            width: 88px;
            height: 88px;
            background: #f59e0b;
            color: white;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.55rem;
            font-weight: 900;
            border: 6px solid #a16207;
            z-index: 1000;
        }

        .game-main-content-row { display: flex; flex: 1; background: #cbd5e1; }
        .game-left-panel { width: 44%; display: flex; flex-direction: column; background: #e2e8f0; padding: 6px; }
        .main-board-container { display: flex; flex-direction: column; background: #fff; border-radius: 12px; flex: 1; margin-bottom: 50px; overflow: hidden; }
        .main-board-bingo-header { display: grid; grid-template-columns: repeat(5, 1fr); background: #f1f5f9; padding: 4px; }
        .main-board-bingo-header div { background: #15803d; color: #fff; font-weight: 900; padding: 2px 0; border-radius: 2px; }
        .main-board-vertical { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; padding: 4px; flex: 1; }
        .board-column { display: flex; flex-direction: column; gap: 2px; justify-content: space-between; }
        .ball-dot { flex: 1; font-size: 0.78rem; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #475569; font-weight: 800; border: 1px solid #e2e8f0; }
        .ball-dot.active { background: #10b981 !important; color: #ffffff !important; font-weight: 900; }

        .game-right-panel { width: 56%; display: flex; flex-direction: column; padding: 6px; }
        #card-area { width: 100%; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; flex: 1; }
        .bingo-card-wrapper { background: #fff; border-radius: 10px; padding: 6px; position: relative; }
        .bingo-card-wrapper.disqualified { opacity: 0.45; filter: grayscale(1); pointer-events: none; }
        .disqualified-tag { position: absolute; inset: 0; background: rgba(239, 68, 68, 0.85); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.2rem; border-radius: 10px; z-index: 50; }
        
        .bingo-card-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; color: #fff; font-weight: 900; text-align: center; margin-bottom: 6px; }
        .bingo-card-header div:nth-child(1) { background: #2563eb; }
        .bingo-card-header div:nth-child(2) { background: #ef4444; }
        .bingo-card-header div:nth-child(3) { background: #eab308; color: #000; }
        .bingo-card-header div:nth-child(4) { background: #10b981; }
        .bingo-card-header div:nth-child(5) { background: #9333ea; }
        
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: #fff; }
        .cell { background: #fff; color: #0f172a; height: 28px; display: flex; align-items: center; justify-content: center; font-weight: 900; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; }
        .cell.selected { background: var(--gold-light) !important; color: #000 !important; }
        .cell.free { background: #2563eb !important; color: #fff; }
        .cell.auto-marked { background: #10b981 !important; color: #fff !important; }
        
        .bingo-btn { width: 100%; padding: 8px 0; background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; font-size: 1rem; font-weight: 900; border-radius: 6px; border: none; cursor: pointer; text-transform: uppercase; margin-top: 6px; }
        .bingo-btn:disabled { background: #64748b !important; cursor: not-allowed; }

        .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:3000; flex-direction:column; align-items:center; justify-content:center; padding: 18px; }
        .modal-content { background: #1e293b; padding: 22px; border-radius: 20px; width: 92%; max-width: 370px; text-align: left; }
        input, textarea { padding: 12px; margin: 8px 0 12px 0; width: 100%; border-radius: 10px; border: 1px solid #475569; font-size: 0.95rem; color: #000; background: #fff; }
        .btn-main { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-top: 6px; }
        .btn-deposit { background: var(--green); color: #000; }
        .btn-withdraw { background: var(--orange); color: white; }
        .btn-cancel { background: #475569; color: white; }
    </style>
</head>
<body>

    <div id="auth-ui">
        <div class="auth-card">
            <h2>BESH BINGO</h2>
            <div class="input-group">
                <label>የተጠቃሚ ስም</label>
                <input type="text" id="reg-username" class="auth-input" placeholder="ስምዎን ያስገቡ...">
            </div>
            <div class="input-group">
                <label>Telegram ID ወይም ስልክ</label>
                <input type="text" id="reg-telegram-id" class="auth-input" placeholder="Telegram ID / ስልክ">
            </div>
            <button class="btn-login" onclick="manualRegister()">🚀 ወደ ጨዋታው ግባ</button>
        </div>
    </div>

    <div id="main-app-content">
        <audio id="win-horn" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3" preload="auto"></audio>
        <div id="inline-notification"></div>

        <!-- LOBBY UI -->
        <div id="lobby-ui">
            <div class="stats-badges-bar">
                <div class="badge-pill badge-room"><span class="badge-label">ROOM</span><span class="badge-val">VIP 💰</span></div>
                <div class="badge-pill badge-sold"><span class="badge-label">SOLD</span><span class="badge-val" id="lobby-sold-count">0</span></div>
                <div class="badge-pill badge-time"><span class="badge-label">TIME</span><span class="badge-val" id="timer">30s</span></div>
                <div class="badge-pill badge-balance" onclick="triggerDepositModal()"><span class="badge-label">BALANCE</span><span class="badge-val" id="lobby-balance-val">20.00 ETB</span></div>
            </div>

            <div style="background:#0f172a; display:flex; justify-content:space-around; padding:6px;">
                <button onclick="triggerDepositModal()" style="background:#059669; color:#fff; border:none; padding:5px 12px; border-radius:8px; font-weight:bold; font-size:0.75rem;">📥 Deposit</button>
                <button onclick="triggerWithdrawModal()" style="background:#d97706; color:#fff; border:none; padding:5px 12px; border-radius:8px; font-weight:bold; font-size:0.75rem;">📤 Withdraw</button>
                <button onclick="openM('trans-m')" style="background:#7c3aed; color:#fff; border:none; padding:5px 12px; border-radius:8px; font-weight:bold; font-size:0.75rem;">💸 Transfer</button>
            </div>

            <div class="grid-container-photo">
                <div class="grid-8-cols" id="ticket-area"></div>
            </div>

            <div class="bottom-slots-tray">
                <div class="slot-card empty" id="slot-1-box">
                    <div style="font-size:1.1rem;">+</div>
                    <div style="font-size:0.6rem; font-weight:bold;">SLOT 1 EMPTY</div>
                </div>
                <div class="slot-card empty" id="slot-2-box">
                    <div style="font-size:1.1rem;">+</div>
                    <div style="font-size:0.6rem; font-weight:bold;">SLOT 2 EMPTY</div>
                </div>
                <button onclick="forceRecoveryRefresh()" style="width:46px; height:46px; border-radius:50%; background:#121c29; color:#fff; border:none; cursor:pointer;">⟳</button>
            </div>
        </div>

        <!-- GAME UI -->
        <div id="game-ui" style="display:none;">
            <div class="game-top-bar">
                <div class="global-stats-bar">
                    <div><span class="stat-label">DERASH</span><div class="stat-val" id="game-prize">0 ETB</div></div>
                    <div><span class="stat-label">BALLS</span><div class="stat-val" id="game-balls-count">0/75</div></div>
                    <div><span class="stat-label">PLAYERS</span><div class="stat-val" id="game-p-count">0</div></div>
                </div>
                <div id="ball-circle"><span id="ball-circle-text">--</span></div>
            </div>

            <div class="game-main-content-row">
                <div class="game-left-panel">
                    <div class="main-board-container">
                        <div class="main-board-bingo-header"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
                        <div class="main-board-vertical" id="main-board"></div>
                    </div>
                </div>
                <div class="game-right-panel">
                    <div id="card-area"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PHONE NUMBER REQUIRED MODAL -->
    <div id="phone-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#f59e0b; margin-top:0;">⚠️ ስልክ ቁጥር ያስፈልጋል</h3>
            <p style="color:#cbd5e1; font-size:0.85rem;">ክፍያ ለመፈጸም እባክዎን ስልክ ቁጥርዎን ያጋሩ</p>
            <input type="tel" id="contact-phone-input" placeholder="09... ወይም 07...">
            <button class="btn-main btn-deposit" onclick="submitPhoneNumber()">📱 ስልክ ቁጥር መዝግብ</button>
            <button class="btn-main btn-cancel" onclick="closeM('phone-modal')">ዝጋ</button>
        </div>
    </div>

    <!-- DEPOSIT METHOD MODAL -->
    <div id="dep-choice-modal" class="modal">
        <div class="modal-content">
            <h3 style="color:#f59e0b; margin-top:0;">💳 የማስገቢያ መንገድ ይምረጡ</h3>
            <button class="btn-main btn-deposit" onclick="openDepositForm('TELE BIRR')">📱 TELE-BIRR</button>
            <button class="btn-main btn-deposit" style="background:#2563eb; color:#fff;" onclick="openDepositForm('CBE BIRR')">🏦 CBE-BIRR</button>
            <button class="btn-main btn-cancel" onclick="closeM('dep-choice-modal')">ተመለስ</button>
        </div>
    </div>

    <!-- DEPOSIT FORM MODAL -->
    <div id="dep-form-modal" class="modal">
        <div class="modal-content">
            <h3 id="dep-method-title" style="color:#f59e0b; margin-top:0;">📱 TELE-Birr</h3>
            <div id="dep-instructions-body" style="font-size:0.8rem; color:#cbd5e1; line-height:1.4; margin-bottom:8px;"></div>
            <textarea id="dep-sms-input" rows="3" placeholder="ሙሉ የ SMS መልእክት እዚህ Paste ያድርጉ..."></textarea>
            <button class="btn-main btn-deposit" onclick="submitDepositSMS()">✅ SMS ላክ (Submit)</button>
            <button class="btn-main btn-cancel" onclick="closeM('dep-form-modal')">ተመለስ</button>
        </div>
    </div>

    <!-- WITHDRAW MODAL -->
    <div id="with-m" class="modal">
        <div class="modal-content">
            <h3 style="color:#f59e0b; margin-top:0;">📤 ብር ወጪ አድርግ (Withdraw)</h3>
            <input type="number" id="with-amt-input" placeholder="የብር መጠን (ዝቅተኛ 20 ETB)">
            <input type="text" id="with-acc-input" placeholder="የቴሌብር ወይም ባንክ አካውንት">
            <input type="text" id="with-name-input" placeholder="የባለቤቱ ሙሉ ስም">
            <button class="btn-main btn-withdraw" onclick="submitWithdraw()">📤 ጥያቄ ላክ</button>
            <button class="btn-main btn-cancel" onclick="closeM('with-m')">ዝጋ</button>
        </div>
    </div>

    <!-- TRANSFER MODAL -->
    <div id="trans-m" class="modal">
        <div class="modal-content">
            <h3 style="color:#a855f7; margin-top:0;">💸 አውቶማቲክ P2P ትራንስፈር</h3>
            <p style="font-size:0.8rem; color:#cbd5e1;">ያለ አድሚን ጣልቃገብነት ወዲያውኑ ይተላለፋል</p>
            <input type="text" id="trans-rec-input" placeholder="የተቀባይ ስልክ / Telegram ID">
            <input type="number" id="trans-amt-input" placeholder="የብር መጠን">
            <button class="btn-main" style="background:#7c3aed; color:#fff;" onclick="submitTransfer()">⚡ ወዲያውኑ አስተላልፍ</button>
            <button class="btn-main btn-cancel" onclick="closeM('trans-m')">ዝጋ</button>
        </div>
    </div>

    <script>
        let telegramId = localStorage.getItem('telegram_id') || '';
        let phone = localStorage.getItem('phone') || '';
        let username = localStorage.getItem('username') || '';
        let firstName = localStorage.getItem('first_name') || '';
        let balance = parseFloat(localStorage.getItem('balance') || '20.00');
        let hasPhone = false;

        let socket = null;
        let latestDrawnBallsGlobal = [];
        let myPurchasedCards = {};
        let currentSelectedDepositMethod = 'TELE BIRR';

        window.addEventListener('DOMContentLoaded', () => {
            let tg = window.Telegram ? window.Telegram.WebApp : null;
            if (tg) {
                tg.expand();
                let user = tg.initDataUnsafe && tg.initDataUnsafe.user;
                if (user) {
                    telegramId = String(user.id);
                    firstName = user.first_name || '';
                    username = user.username || '';
                }
            }
            if (telegramId || phone) {
                syncUser();
            } else {
                document.getElementById('auth-ui').style.display = 'flex';
            }
        });

        function syncUser() {
            fetch('/register_or_login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, first_name: firstName, username: username })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    balance = parseFloat(d.balance) || 20.00;
                    hasPhone = !!d.has_phone;
                    if (d.phone) phone = d.phone;
                    updateBal();
                    document.getElementById('auth-ui').style.display = 'none';
                    document.getElementById('main-app-content').style.display = 'flex';
                    initTicketsOnce();
                    initWebSocket();
                    renderMainBoard([]);
                }
            });
        }

        function manualRegister() {
            firstName = document.getElementById('reg-username').value.trim();
            telegramId = document.getElementById('reg-telegram-id').value.trim();
            if (!firstName || !telegramId) return alert("እባክዎ መረጃዎን ያስገቡ!");
            syncUser();
        }

        function updateBal() {
            document.getElementById('lobby-balance-val').innerText = balance.toFixed(2) + " ETB";
        }

        function openM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }

        function triggerDepositModal() {
            if (!hasPhone && !phone) return openM('phone-modal');
            openM('dep-choice-modal');
        }

        function triggerWithdrawModal() {
            if (!hasPhone && !phone) return openM('phone-modal');
            openM('with-m');
        }

        function submitPhoneNumber() {
            let p = document.getElementById('contact-phone-input').value.trim();
            fetch('/update_phone_number', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: p })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    phone = d.phone;
                    hasPhone = true;
                    closeM('phone-modal');
                    alert("ስልክ ቁጥርዎ ተመዝግቧል!");
                } else alert(d.msg);
            });
        }

        function openDepositForm(m) {
            currentSelectedDepositMethod = m;
            closeM('dep-choice-modal');
            document.getElementById('dep-method-title').innerText = m;
            document.getElementById('dep-instructions-body').innerHTML = `
                <strong>የ ${m} አካውንት 0960736061 (ZEHARA)</strong><br><br>
                1. ከላይ ባለው አካውንት ገንዘቡን ያስገቡ<br>
                2. ብሩን ስትልኩ አጭር SMS ይደርሳችኋል<br>
                3. SMS ኮፒ በማድረግ ከታች ፔስት (Paste) አድርገው ይላኩ
            `;
            openM('dep-form-modal');
        }

        function submitDepositSMS() {
            let sms = document.getElementById('dep-sms-input').value.trim();
            fetch('/request_deposit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, method: currentSelectedDepositMethod, sms_text: sms })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    closeM('dep-form-modal');
                    alert(d.msg);
                } else alert(d.msg || "ትክክል አይደለም");
            });
        }

        function submitWithdraw() {
            let amt = parseFloat(document.getElementById('with-amt-input').value);
            let acc = document.getElementById('with-acc-input').value.trim();
            let name = document.getElementById('with-name-input').value.trim();
            fetch('/request_withdrawal', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, amount: amt, account_number: acc, account_holder: name })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    balance -= amt;
                    updateBal();
                    closeM('with-m');
                    alert(d.msg);
                } else alert(d.msg);
            });
        }

        function submitTransfer() {
            let rec = document.getElementById('trans-rec-input').value.trim();
            let amt = parseFloat(document.getElementById('trans-amt-input').value);
            fetch('/request_transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, receiver_phone: rec, amount: amt })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    balance -= amt;
                    updateBal();
                    closeM('trans-m');
                    alert(d.msg);
                } else alert(d.msg);
            });
        }

        function initWebSocket() {
            if (typeof io !== "undefined") {
                socket = io();
                socket.on('game_update_10', (d) => { applyGameState(d); });
                socket.on('balance_update', (d) => {
                    if (d.phone === phone) { balance = d.balance; updateBal(); }
                });
            }
        }

        function forceRecoveryRefresh() {
            fetch(`/get_status?telegram_id=${telegramId}&phone=${phone}&room=10`)
            .then(r => r.json())
            .then(d => applyGameState(d));
        }

        function applyGameState(d) {
            if (!d) return;
            document.getElementById('timer').innerText = (d.timer || 30) + "s";
            document.getElementById('game-prize').innerText = Math.floor((d.pot || 0) * 0.8) + " ETB";
            document.getElementById('game-p-count').innerText = d.active_players || 0;
            document.getElementById('lobby-sold-count').innerText = Object.keys(d.sold_tickets || {}).length;

            if (d.status === "lobby") {
                document.getElementById('lobby-ui').style.display = 'flex';
                document.getElementById('game-ui').style.display = 'none';
                renderTickets(d.sold_tickets || {});
            } else if (d.status === "playing") {
                document.getElementById('lobby-ui').style.display = 'none';
                document.getElementById('game-ui').style.display = 'flex';
                document.getElementById('ball-circle-text').innerText = d.current_ball || "--";
                latestDrawnBallsGlobal = d.drawn_balls || [];
                renderMainBoard(latestDrawnBallsGlobal);
                renderGameCards(d.disqualified || []);
            }
        }

        function initTicketsOnce() {
            let area = document.getElementById('ticket-area');
            if (area.children.length === 0) {
                for (let i = 1; i <= 500; i++) {
                    let div = document.createElement('div');
                    div.className = 't-box';
                    div.id = 't-' + i;
                    div.innerText = i;
                    div.onclick = () => buyTicket(i);
                    area.appendChild(div);
                }
            }
        }

        function renderTickets(sold) {
            let myKey = phone || telegramId;
            for (let i = 1; i <= 500; i++) {
                let box = document.getElementById('t-' + i);
                if (!box) continue;
                if (sold[i]) {
                    let isMine = (sold[i] === myKey);
                    box.className = isMine ? 't-box mine' : 't-box sold';
                    // ደግመው ሲነኩት ያለምንም ጥያቄ ብሩ ወዲያው ይመለሳል
                    box.onclick = isMine ? () => refundTicket(i) : null;
                } else {
                    box.className = 't-box';
                    box.onclick = () => buyTicket(i);
                }
            }
        }

        function buyTicket(n) {
            if (Object.keys(myPurchasedCards).length >= 2) return alert("ከ 2 ካርቴላ በላይ መግዛት አይቻልም!");
            if (balance < 10) return alert("በቂ ሒሳብ የለህም!");
            fetch('/buy_specific_ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, ticket_num: n, room: '10' })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    balance = d.balance;
                    updateBal();
                    myPurchasedCards[String(n)] = d.card;
                    forceRecoveryRefresh();
                } else alert(d.msg);
            });
        }

        function refundTicket(n) {
            fetch('/cancel_ticket', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, ticket_num: n, room: '10' })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    balance = d.balance;
                    updateBal();
                    delete myPurchasedCards[String(n)];
                    forceRecoveryRefresh();
                }
            });
        }

        function renderMainBoard(drawn) {
            let board = document.getElementById('main-board');
            board.innerHTML = "";
            let drawnSet = new Set(drawn.map(b => parseInt(b.slice(1))));

            for (let c = 0; c < 5; c++) {
                let colDiv = document.createElement('div');
                colDiv.className = 'board-column';
                let start = c * 15 + 1;
                for (let i = start; i <= start + 14; i++) {
                    let d = document.createElement('div');
                    d.className = 'ball-dot' + (drawnSet.has(i) ? ' active' : '');
                    d.innerText = i;
                    colDiv.appendChild(d);
                }
                board.appendChild(colDiv);
            }
        }

        function renderGameCards(disqualifiedList) {
            let cardArea = document.getElementById('card-area');
            cardArea.innerHTML = "";
            let drawnSet = new Set(latestDrawnBallsGlobal.map(b => parseInt(b.slice(1))));
            drawnSet.add(0);

            for (let cardId in myPurchasedCards) {
                let card = myPurchasedCards[cardId];
                let isDisq = disqualifiedList.includes(String(cardId));
                let wrap = document.createElement('div');
                wrap.className = 'bingo-card-wrapper' + (isDisq ? ' disqualified' : '');
                if (isDisq) wrap.innerHTML += '<div class="disqualified-tag">DISQUALIFIED</div>';

                wrap.innerHTML += '<div class="bingo-card-header"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>';
                let grid = document.createElement('div');
                grid.className = 'bingo-card';

                card.forEach((num, idx) => {
                    let cell = document.createElement('div');
                    let isFree = idx === 12 || num === 0;
                    cell.className = 'cell' + (isFree ? ' free selected' : '');
                    cell.innerText = isFree ? '★' : num;
                    cell.onclick = () => {
                        if (!drawnSet.has(num)) return alert("ይህ ቁጥር ገና አልወጣም!");
                        cell.classList.toggle('selected');
                    };
                    grid.appendChild(cell);
                });
                wrap.appendChild(grid);

                let btn = document.createElement('button');
                btn.className = 'bingo-btn';
                btn.innerText = `BINGO! #${cardId}`;
                btn.onclick = () => claimBingo(cardId, wrap, btn);
                wrap.appendChild(btn);

                cardArea.appendChild(wrap);
            }
        }

        function claimBingo(cardId, wrap, btn) {
            btn.disabled = true;
            fetch('/claim_bingo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: telegramId, phone: phone, ticket_num: cardId, room: '10' })
            })
            .then(r => r.json())
            .then(d => {
                if (!d.success && d.disqualified) {
                    wrap.classList.add('disqualified');
                    wrap.innerHTML += '<div class="disqualified-tag">DISQUALIFIED</div>';
                    alert(d.msg);
                } else if (!d.success) {
                    btn.disabled = false;
                    alert(d.msg);
                }
            });
        }
    </script>
</body>
</html>
